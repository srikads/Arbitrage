[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-watcher"
version = "0.1.0"
description = "Privacy-first watcher for long-term stock/ETF holdings: public data in, encrypted feed and push notifications out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.50",
  "cryptography>=42",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
forums = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
arbitrage-watcher = "arbitrage_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["arbitrage_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
